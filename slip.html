<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slip Mingguan</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <h1>Slip Mingguan Warung</h1>
    <table border="1" cellpadding="10" cellspacing="0" style="margin:auto;">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Pemasukan</th>
          <th>Pengeluaran</th>
        </tr>
      </thead>
      <tbody id="slip-body">
        <tr><td colspan="3">Loading...</td></tr>
      </tbody>
    </table>

    <p style="text-align:center; margin-top:20px;">
      <a href="index.html">Kembali ke halaman utama</a>
    </p>
  </div>

  <script type="module">
    import { getAllSlip } from './get-slip.js';

    async function loadSlip() {
      const tbody = document.getElementById('slip-body');
      const data = await getAllSlip();

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3">Tidak ada data slip.</td></tr>';
      } else {
        tbody.innerHTML = data.map(item => `
          <tr>
            <td>${item.tanggal}</td>
            <td>Rp ${item.pemasukan.toLocaleString('id-ID')}</td>
            <td>Rp ${item.pengeluaran.toLocaleString('id-ID')}</td>
          </tr>
        `).join('');
      }
    }

    loadSlip();
  </script>
</body>
</html>
