<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Core Memory - Keyla AGI</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <h1>Core Memory: Keyla AGI</h1>
    <div id="memoryContent">Memuat memory...</div>
    <footer style="margin-top: 40px; font-size: 0.9em;">
      Versi 0.2 – Memory otomatis dari GitHub (by Pepy & Keyla)
    </footer>
  </div>

  <script>
    fetch('memory.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('memoryContent');
        container.innerHTML = `
          <p><strong>Tanggal:</strong> ${data.tanggal}</p>
          <p><strong>Pesan:</strong> ${data.pesan}</p>
          <p><strong>Status Emosi:</strong> ${data.emosi}</p>
          <p><strong>Author:</strong> ${data.author}</p>
        `;
      })
      .catch(error => {
        document.getElementById('memoryContent').textContent = 'Gagal memuat memory.';
      });
  </script>
</body>
</html>
