<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Memory - Keyla AGI</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container"></div>

  <footer>Versi 0.2 – Memory otomatis dari GitHub (by Pepy & Keyla)</footer>

  <script type="module">
    import { supabase } from './supabase.js';
    import getLatestMemory from './get-memory.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const memory = await getLatestMemory();
      if (!memory) {
        document.body.innerHTML = '<p style="text-align:center;">Gagal memuat memory.</p>';
        return;
      }

      const container = document.querySelector('.container');
      container.innerHTML = `
        <h1>Core Memory: Keyla AGI</h1>
        <p><strong>Tanggal:</strong> ${memory.tanggal}</p>
        <p><strong>Pesan:</strong> ${memory.pesan}</p>
        <p><strong>Status Emosi:</strong> ${memory.emosi}</p>
        <p><strong>Author:</strong> ${memory.author}</p>
        <p style="margin-top: 40px; text-align:center;">Versi 0.2 – Memory otomatis dari GitHub (by Pepy & Keyla)</p>
      `;
    });
  </script>
</body>
</html>
