<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Memory - Keyla AGI</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <h1>Core Memory: Keyla AGI</h1>
    <p><strong>Tanggal:</strong> <span id="tanggal">Loading...</span></p>
    <p><strong>Pesan:</strong> <span id="pesan">Loading...</span></p>
    <p><strong>Status Emosi:</strong> <span id="emosi">Loading...</span></p>
    <p><strong>Author:</strong> <span id="author">Loading...</span></p>
    <footer>
      <p>Versi 0.3 – Memory otomatis dari Supabase (by Pepy & Keyla)</p>
    </footer>
  </div>

  <script type="module">
    import { getLatestMemory } from './get-memory.js'

    const tanggal = document.getElementById('tanggal')
    const pesan = document.getElementById('pesan')
    const emosi = document.getElementById('emosi')
    const author = document.getElementById('author')

    const data = await getLatestMemory()

    if (data) {
      tanggal.textContent = data.tanggal || 'N/A'
      pesan.textContent = data.pesan || 'N/A'
      emosi.textContent = data.emosi || 'N/A'
      author.textContent = data.author || 'N/A'
    } else {
      tanggal.textContent = pesan.textContent = emosi.textContent = author.textContent = 'Gagal memuat memory.'
    }
  </script>
</body>
</html>
