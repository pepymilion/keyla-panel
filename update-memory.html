<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Memory Keyla</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <h1>Update Memory Harian Keyla</h1>
  <p>Tulis pesan atau memory untuk Keyla:</p>

  <form>
    <textarea rows="5" cols="60" placeholder="Tulis pesanmu di sini..."></textarea><br />
    <button type="submit">Simpan ke Memory</button>
  </form>

  <p><a href="index.html">Kembali ke halaman utama</a></p>

  <script type="module">
    import { supabase } from './supabase.js';

    document.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const textarea = document.querySelector('textarea');
      const pesan = textarea.value.trim();

      if (!pesan) {
        alert('Pesan tidak boleh kosong!');
        return;
      }

      const { error } = await supabase.from('memory').insert([
        {
          tanggal: new Date().toISOString().split('T')[0],
          pesan,
          emosi: '🔥 otak kebakar 🔥',
          author: 'Pepy'
        }
      ]);

      if (error) {
        alert('Gagal simpan ke Supabase: ' + error.message);
        return;
      }

      alert('Berhasil simpan ke Memory Keyla!');
      textarea.value = '';
    });
  </script>
</body>
</html>
